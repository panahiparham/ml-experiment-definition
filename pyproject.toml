[tool]
[tool.setuptools.packages.find]
where = ["."]  # list of folders that contain the packages (["."] by default)
include = ["ml_experiment*"]  # package names should match these glob patterns (["*"] by default)

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.0.0"
tag_format = "$version"
version_files = ["pyproject.toml"]

[tool.ruff.lint]
select = ['F', 'E', 'W', 'B']
ignore = ['E501', 'E701', 'B023']

[tool.pyright]
include = ['ml_experiment', 'tests']
venvPath = '.'
venv = '.venv'
typeCheckingMode = 'standard'
useLibraryCodeForTypes = true

[project]
name = "ml-experiment"
version = "0.0.0"
description = ""
authors = [
    {name = "Parham Panahi", email = "parham1@ualberta.ca"},
    {name = "Andy Patterson", email = "ap3@ualberta.ca"},
]
dependencies = [
    "click>=8.1.8",
    "rich~=13.9",
]
requires-python = ">=3.11,<3.13"
readme = "README.md"
license = {text = "MIT"}

classifiers = [
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]

[project.scripts]
exp = "ml_experiment.cli:main"

[dependency-groups]
dev = [
    "commitizen>=4.2.1",
    "pip>=25.0",
    "pre-commit>=4.1.0",
    "pyright>=1.1.393",
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.5",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
